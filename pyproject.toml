[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exopy"
version = "0.1.0"
description = "Python CLI for Garmin Catalyst SupportLogs telemetry data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pgpy>=0.6.0",
    "cryptography>=41.0.0",
]

[project.scripts]
exopy = "exopy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:.*TripleDES.*:Warning",
    "ignore:.*Camellia.*:Warning",
    "ignore:.*CFB.*:Warning",
]
